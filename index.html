<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>꼬마 비행기 1942: 하늘 모험</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts for friendly, playful typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@700&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <!-- FontAwesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      font-family: 'Jua', 'Nunito', sans-serif;
    }
    
    body {
      background: radial-gradient(circle at top, #bbf2f6 0%, #86e3ce 50%, #d1f2a5 100%);
      overflow: hidden;
      touch-action: none;
    }

    /* Bounce and bubble animations */
    @keyframes floatBob {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }
    .animate-bob {
      animation: floatBob 2.4s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 4px 10px rgba(255,200,50,0.6)); }
      50% { transform: scale(1.06); filter: drop-shadow(0 6px 18px rgba(255,160,0,0.9)); }
    }
    .animate-glow {
      animation: pulseGlow 1.5s ease-in-out infinite;
    }

    /* Chunky kid-friendly buttons */
    .kid-btn {
      box-shadow: 0 6px 0px rgba(0,0,0,0.18), 0 10px 15px rgba(0,0,0,0.12);
      transition: all 0.1s ease;
    }
    .kid-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0px rgba(0,0,0,0.18), 0 4px 8px rgba(0,0,0,0.1);
    }

    /* Canvas styling */
    #gameCanvas {
      touch-action: none;
      cursor: grab;
      image-rendering: auto;
    }
    #gameCanvas:active {
      cursor: grabbing;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen w-full p-2 select-none relative">

  <div class="relative w-full max-w-lg h-[92vh] max-h-[820px] bg-sky-100 rounded-3xl shadow-2xl overflow-hidden flex flex-col border-4 border-white">
    
    <!-- Top HUD Bar -->
    <header class="absolute top-0 left-0 right-0 z-20 flex items-center justify-between px-4 py-2 bg-white/80 backdrop-blur-md border-b-2 border-amber-200 shadow-sm">
      <!-- Heart Health & Invincible status -->
      <div class="flex items-center gap-1.5" id="heartContainer">
        <!-- Rendered by JS -->
      </div>

      <!-- Current Score and Star Badge -->
      <div class="flex items-center gap-2 bg-amber-100 px-3 py-1 rounded-full border border-amber-300">
        <span class="text-xl">⭐</span>
        <span id="scoreDisplay" class="text-xl font-bold text-amber-800 tracking-wider">0</span>
      </div>

      <!-- Sound & Settings Buttons -->
      <div class="flex items-center gap-2">
        <button id="bgmToggleBtn" class="w-10 h-10 rounded-full bg-pink-400 text-white flex items-center justify-center text-lg kid-btn" title="음악 켜기/끄기">
          <i class="fa-solid fa-music"></i>
        </button>
        <button id="pauseBtn" class="w-10 h-10 rounded-full bg-sky-400 text-white flex items-center justify-center text-lg kid-btn" title="일시정지">
          <i class="fa-solid fa-pause"></i>
        </button>
      </div>
    </header>

    <!-- Main Game Canvas -->
    <canvas id="gameCanvas" class="w-full h-full bg-blue-300"></canvas>

    <!-- Bottom Controls & Special Move (Looping / 공중제비!) -->
    <div class="absolute bottom-3 left-0 right-0 z-20 flex justify-between items-center px-4 pointer-events-none">
      <!-- Kid mode badge -->
      <div class="pointer-events-auto bg-white/90 px-3 py-1.5 rounded-2xl border-2 border-emerald-300 shadow-md flex items-center gap-1.5">
        <button id="godModeBtn" class="text-xs md:text-sm font-bold text-emerald-700 flex items-center gap-1">
          <i class="fa-solid fa-shield-cat text-emerald-500 text-base"></i>
          <span id="godModeText">무적 모드: ON</span>
        </button>
      </div>

      <!-- Signature 1942 Barrel Roll / 공중제비 버튼! -->
      <button id="loopBtn" class="pointer-events-auto kid-btn animate-glow bg-gradient-to-r from-amber-400 via-pink-400 to-purple-400 text-white font-extrabold px-5 py-3 rounded-full flex items-center gap-2 border-2 border-white shadow-xl text-lg">
        <i class="fa-solid fa-rotate text-xl animate-spin-slow"></i>
        <span>빙글 슛! (<span id="loopCountText">3</span>)</span>
      </button>
    </div>

    <!-- Start / Title Overlay -->
    <div id="startOverlay" class="absolute inset-0 z-30 flex flex-col items-center justify-center bg-gradient-to-b from-sky-400/95 via-sky-300/90 to-amber-200/95 p-6 text-center backdrop-blur-sm">
      <div class="animate-bob mb-2">
        <span class="text-6xl">✈️</span>
        <span class="text-5xl">🌈</span>
      </div>
      <h1 class="text-4xl md:text-5xl font-extrabold text-white drop-shadow-[0_4px_4px_rgba(0,0,0,0.25)] tracking-wide">
        꼬마 비행기 1942
      </h1>
      <p class="text-amber-900 font-bold text-lg mt-1 mb-4">구름과 풍선을 터뜨리며 하늘을 날아요!</p>

      <!-- Airplane Color Chooser -->
      <div class="bg-white/80 p-3 rounded-2xl mb-5 shadow-inner border-2 border-white w-full max-w-xs">
        <div class="text-sm text-sky-800 font-bold mb-2">내 비행기 색상 고르기</div>
        <div class="flex justify-center gap-3" id="colorPickerGroup">
          <button class="color-choice w-11 h-11 rounded-full bg-red-400 border-4 border-white shadow-md transform hover:scale-110 active:scale-95 transition" data-color="#ff5e62"></button>
          <button class="color-choice w-11 h-11 rounded-full bg-yellow-400 border-4 border-yellow-200 ring-4 ring-amber-400 shadow-md transform hover:scale-110 active:scale-95 transition" data-color="#ffb300"></button>
          <button class="color-choice w-11 h-11 rounded-full bg-sky-400 border-4 border-white shadow-md transform hover:scale-110 active:scale-95 transition" data-color="#00c0ff"></button>
          <button class="color-choice w-11 h-11 rounded-full bg-emerald-400 border-4 border-white shadow-md transform hover:scale-110 active:scale-95 transition" data-color="#2ecc71"></button>
          <button class="color-choice w-11 h-11 rounded-full bg-purple-400 border-4 border-white shadow-md transform hover:scale-110 active:scale-95 transition" data-color="#9b59b6"></button>
        </div>
      </div>

      <!-- Play Button -->
      <button id="startGameBtn" class="kid-btn bg-gradient-to-b from-yellow-300 to-amber-500 text-amber-950 font-black text-2xl px-10 py-4 rounded-3xl border-4 border-white shadow-2xl hover:scale-105 active:scale-95 transition flex items-center gap-3">
        <i class="fa-solid fa-play text-2xl text-amber-900"></i>
        <span>모험 시작하기!</span>
      </button>

      <div class="mt-4 text-xs md:text-sm text-sky-900 font-semibold bg-white/60 px-3 py-1.5 rounded-full">
        👉 손가락이나 마우스로 비행기를 끌어보세요!
      </div>
    </div>

    <!-- Pause Overlay -->
    <div id="pauseOverlay" class="absolute inset-0 z-30 hidden flex flex-col items-center justify-center bg-black/40 backdrop-blur-sm p-6 text-center">
      <div class="bg-white rounded-3xl p-6 shadow-2xl border-4 border-amber-300 w-full max-w-xs flex flex-col items-center">
        <div class="text-5xl mb-2">☕</div>
        <h2 class="text-3xl font-extrabold text-amber-800 mb-2">잠깐 쉬어가기</h2>
        <p class="text-gray-600 text-sm mb-5">비행기가 구름 위에서 쉬고 있어요</p>
        <button id="resumeBtn" class="w-full kid-btn bg-emerald-500 text-white font-bold text-xl py-3 rounded-2xl border-2 border-emerald-300 mb-3 flex items-center justify-center gap-2">
          <i class="fa-solid fa-play"></i> 계속 날기
        </button>
        <button id="restartBtn" class="w-full kid-btn bg-rose-400 text-white font-bold text-lg py-2.5 rounded-2xl border-2 border-rose-200 flex items-center justify-center gap-2">
          <i class="fa-solid fa-arrow-rotate-left"></i> 처음부터
        </button>
      </div>
    </div>

    <!-- Cheerful Stage Clear / Victory Overlay -->
    <div id="victoryOverlay" class="absolute inset-0 z-30 hidden flex flex-col items-center justify-center bg-sky-900/50 backdrop-blur-md p-6 text-center">
      <div class="bg-white rounded-3xl p-6 shadow-2xl border-4 border-yellow-400 w-full max-w-xs flex flex-col items-center animate-bob">
        <div class="text-6xl mb-1">🎉</div>
        <h2 class="text-3xl font-black text-pink-600 mb-1">참 잘했어요!</h2>
        <p class="text-amber-800 font-bold mb-3">멋진 하늘 모험 비행사!</p>
        <div class="bg-amber-50 rounded-2xl p-3 border border-amber-200 w-full mb-4">
          <div class="text-sm text-gray-500">모은 별 점수</div>
          <div id="finalScoreText" class="text-3xl font-black text-amber-600">0점</div>
        </div>
        <button id="playAgainBtn" class="w-full kid-btn bg-amber-400 text-amber-950 font-black text-xl py-3 rounded-2xl border-2 border-white shadow-lg flex items-center justify-center gap-2">
          <i class="fa-solid fa-rotate-right"></i> 한 번 더 날기!
        </button>
      </div>
    </div>

  </div>

  <script>
    // --- Web Audio API Synthesizer (No external mp3 needed, toddler-friendly happy tones) ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.isMuted = false;
        this.bgmInterval = null;
        this.bgmNoteIndex = 0;
        // Pentatonic bright scale notes (C4, D4, E4, G4, A4, C5)
        this.scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];
        this.melody = [0, 2, 4, 5, 4, 2, 0, 3, 2, 0, 4, 5, 2, 4, 3, 0];
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      toggleMute() {
        this.isMuted = !this.isMuted;
        if (this.isMuted) {
          this.stopBGM();
        } else {
          this.startBGM();
        }
        return this.isMuted;
      }

      // Bubble pop sound (firing bubble)
      playShoot() {
        if (this.isMuted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(450, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);

        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.08);
      }

      // Gentle balloon/cloud pop sound
      playPop() {
        if (this.isMuted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.12);

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.12);
      }

      // Star / Candy collect sparkle
      playCollect() {
        if (this.isMuted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6 arpeggio
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.04);
          gain.gain.setValueAtTime(0.1, now + idx * 0.04);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.04 + 0.12);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.04);
          osc.stop(now + idx * 0.04 + 0.12);
        });
      }

      // Loop-the-loop swoop sound
      playLoop() {
        if (this.isMuted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(660, now + 0.4);
        osc.frequency.exponentialRampToValueAtTime(330, now + 0.8);

        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.8);
      }

      // Gentle celebratory fanfare
      playCheer() {
        if (this.isMuted || !this.ctx) return;
        const chords = [
          [523.25, 659.25, 783.99],
          [587.33, 739.99, 880.00],
          [659.25, 830.61, 987.77],
          [1046.5, 1318.5, 1567.98]
        ];
        chords.forEach((chord, i) => {
          const time = this.ctx.currentTime + i * 0.18;
          chord.forEach(freq => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, time);
            gain.gain.setValueAtTime(0.08, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.28);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(time);
            osc.stop(time + 0.28);
          });
        });
      }

      // Playful gentle background chimes
      startBGM() {
        if (this.bgmInterval || this.isMuted) return;
        this.bgmInterval = setInterval(() => {
          if (!this.ctx || this.isMuted) return;
          const now = this.ctx.currentTime;
          const noteIndex = this.melody[this.bgmNoteIndex % this.melody.length];
          const freq = this.scale[noteIndex];
          this.bgmNoteIndex++;

          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq * 0.75, now);

          gain.gain.setValueAtTime(0.04, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.35);
        }, 360);
      }

      stopBGM() {
        if (this.bgmInterval) {
          clearInterval(this.bgmInterval);
          this.bgmInterval = null;
        }
      }
    }

    const sound = new SoundEngine();

    // --- Canvas Setup & Game Variables ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let cw = 0;
    let ch = 0;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      cw = rect.width;
      ch = rect.height;
      canvas.width = cw * dpr;
      canvas.height = ch * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resizeCanvas);

    // Game Core State
    let gameState = 'START'; // 'START', 'PLAYING', 'PAUSED', 'CLEAR'
    let score = 0;
    let maxLives = 5;
    let lives = 5;
    let godMode = true; // By default ON for toddlers! No instant deaths!
    let loopBombs = 3;
    let playerColor = '#ffb300'; // Default sunny yellow
    let lastTime = 0;
    let shootTimer = 0;
    let spawnTimer = 0;
    let cloudScrollY = 0;
    let waterScrollY = 0;

    // Interactive entities
    let player = {
      x: 0,
      y: 0,
      targetX: 0,
      targetY: 0,
      width: 48,
      height: 48,
      propellerAngle: 0,
      isLooping: false,
      loopProgress: 0, // 0 to 1
      invulnerableTimer: 0,
      tilt: 0
    };

    let bullets = [];
    let enemies = [];
    let items = [];
    let particles = [];
    let floatingTexts = [];

    // Background floating elements (islands, clouds)
    let islands = [];
    let clouds = [];

    function initBackground() {
      islands = [];
      clouds = [];
      // Generate some cute sunny islands in the sea
      for (let i = 0; i < 4; i++) {
        islands.push({
          x: Math.random() * (cw || 360),
          y: Math.random() * (ch || 600),
          radius: 35 + Math.random() * 25,
          color: ['#a8e6cf', '#dcedc1', '#ffd3b6'][Math.floor(Math.random() * 3)],
          palmCount: 1 + Math.floor(Math.random() * 3)
        });
      }
      // Generate cheerful fluffy clouds
      for (let i = 0; i < 6; i++) {
        clouds.push({
          x: Math.random() * (cw || 360),
          y: Math.random() * (ch || 600),
          scale: 0.6 + Math.random() * 0.8,
          speed: 0.4 + Math.random() * 0.5,
          opacity: 0.5 + Math.random() * 0.3
        });
      }
    }

    function drawBackground(dt) {
      // 1. Ocean gradient background
      waterScrollY += dt * 30;
      const oceanGrad = ctx.createLinearGradient(0, 0, 0, ch);
      oceanGrad.addColorStop(0, '#56ccf2');
      oceanGrad.addColorStop(1, '#2f80ed');
      ctx.fillStyle = oceanGrad;
      ctx.fillRect(0, 0, cw, ch);

      // Ripple lines
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.lineWidth = 3;
      const rippleOffset = (waterScrollY * 0.5) % 80;
      for (let y = -80 + rippleOffset; y < ch + 80; y += 80) {
        ctx.beginPath();
        for (let x = 0; x < cw; x += 40) {
          ctx.arc(x + 20, y, 12, 0, Math.PI);
        }
        ctx.stroke();
      }

      // 2. Draw tropical islands
      islands.forEach(isl => {
        isl.y += dt * 25;
        if (isl.y - isl.radius > ch) {
          isl.y = -isl.radius * 2;
          isl.x = Math.random() * cw;
        }

        // Island sand & grass
        ctx.fillStyle = '#fce38a'; // Sand
        ctx.beginPath();
        ctx.arc(isl.x, isl.y, isl.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = isl.color; // Lush green
        ctx.beginPath();
        ctx.arc(isl.x - 3, isl.y - 3, isl.radius * 0.78, 0, Math.PI * 2);
        ctx.fill();

        // Cute mini palm trees
        for (let p = 0; p < isl.palmCount; p++) {
          const px = isl.x + (p - 1) * 12;
          const py = isl.y + (p % 2) * 8;
          ctx.fillStyle = '#8b5a2b';
          ctx.fillRect(px - 2, py - 6, 4, 8);
          ctx.fillStyle = '#27ae60';
          ctx.beginPath();
          ctx.arc(px, py - 8, 7, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      // 3. Draw peaceful fluffy drifting clouds
      clouds.forEach(c => {
        c.y += c.speed * dt * 45;
        if (c.y - 50 > ch) {
          c.y = -60;
          c.x = Math.random() * cw;
        }

        ctx.save();
        ctx.globalAlpha = c.opacity;
        ctx.fillStyle = '#ffffff';
        const cx = c.x;
        const cy = c.y;
        const s = c.scale;

        ctx.beginPath();
        ctx.arc(cx, cy, 22 * s, 0, Math.PI * 2);
        ctx.arc(cx + 18 * s, cy - 8 * s, 26 * s, 0, Math.PI * 2);
        ctx.arc(cx + 42 * s, cy, 20 * s, 0, Math.PI * 2);
        ctx.arc(cx + 20 * s, cy + 10 * s, 22 * s, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    function drawPlayer(dt) {
      player.propellerAngle += dt * 35;

      // Handle Loop-the-loop maneuver (1942 Signature!)
      let currentScale = 1;
      let rotAngle = 0;
      let alpha = 1;

      if (player.isLooping) {
        player.loopProgress += dt * 1.25; // 0.8s loop
        const p = player.loopProgress;
        
        // Loop trajectory: spins 360, scales up then back to simulate 3D loop!
        rotAngle = p * Math.PI * 2;
        currentScale = 1 + Math.sin(p * Math.PI) * 0.9; // Zooms up in the sky

        // Rainbow sparkle trail during loop
        if (Math.random() < 0.6) {
          createRainbowParticle(player.x, player.y);
        }

        if (player.loopProgress >= 1) {
          player.isLooping = false;
          player.loopProgress = 0;
        }
      }

      // Invulnerability flicker
      if (player.invulnerableTimer > 0) {
        player.invulnerableTimer -= dt;
        alpha = Math.floor(player.invulnerableTimer * 12) % 2 === 0 ? 0.35 : 1;
      }

      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.scale(currentScale, currentScale);
      ctx.rotate(rotAngle + player.tilt * 0.15);
      ctx.globalAlpha = alpha;

      // --- Biplane Shadow ---
      if (!player.isLooping) {
        ctx.fillStyle = 'rgba(0, 40, 80, 0.2)';
        ctx.beginPath();
        ctx.ellipse(6, 16, 20, 10, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // --- Plane Wings (Top & Bottom biplane aesthetic) ---
      // Main wing
      ctx.fillStyle = playerColor;
      ctx.beginPath();
      ctx.roundRect(-28, -6, 56, 12, 6);
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      // Wing decorative stripes
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-22, -6, 5, 12);
      ctx.fillRect(17, -6, 5, 12);

      // --- Plane Fuselage (Body) ---
      ctx.fillStyle = playerColor;
      ctx.beginPath();
      ctx.ellipse(0, 0, 14, 28, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      // Tail wings
      ctx.fillStyle = '#ff7675';
      ctx.beginPath();
      ctx.roundRect(-14, 20, 28, 7, 3);
      ctx.fill();
      ctx.stroke();

      // Pilot Cockpit / Cute Smile
      ctx.fillStyle = '#74b9ff';
      ctx.beginPath();
      ctx.arc(0, -5, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Cute pilot goggles or eyes
      ctx.fillStyle = '#2d3436';
      ctx.beginPath();
      ctx.arc(-3, -6, 2, 0, Math.PI * 2);
      ctx.arc(3, -6, 2, 0, Math.PI * 2);
      ctx.fill();

      // Cheerful cheek blush
      ctx.fillStyle = 'rgba(255, 105, 180, 0.6)';
      ctx.beginPath();
      ctx.arc(-6, -2, 2.5, 0, Math.PI * 2);
      ctx.arc(6, -2, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // --- Propeller (Spinning in front) ---
      ctx.save();
      ctx.translate(0, -28);
      ctx.rotate(player.propellerAngle);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.beginPath();
      ctx.ellipse(0, 0, 3, 16, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#e17055';
      ctx.beginPath();
      ctx.arc(0, 0, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.restore();
    }

    // Enemy types:
    // 1. "balloon": Smiling colorful floating balloons
    // 2. "cloud": Cute chubby clouds that blink
    // 3. "origami": Cute paper airplanes that swirl
    // 4. "blimp": Big happy airship boss/mini-boss!
    function spawnEnemy() {
      const types = ['balloon', 'cloud', 'origami'];
      if (Math.random() < 0.15) types.push('blimp');
      const type = types[Math.floor(Math.random() * types.length)];

      let enemy = {
        x: 30 + Math.random() * (cw - 60),
        y: -40,
        type: type,
        hp: type === 'blimp' ? 6 : (type === 'cloud' ? 2 : 1),
        maxHp: type === 'blimp' ? 6 : (type === 'cloud' ? 2 : 1),
        speed: type === 'blimp' ? 45 : (type === 'cloud' ? 60 : 85),
        radius: type === 'blimp' ? 32 : (type === 'cloud' ? 22 : 18),
        color: ['#ff7675', '#a29bfe', '#fd79a8', '#ffeaa7', '#55efc4'][Math.floor(Math.random() * 5)],
        time: 0,
        swayOffset: Math.random() * 10
      };
      enemies.push(enemy);
    }

    function drawEnemies(dt) {
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.time += dt;
        e.y += e.speed * dt;
        // Gentle kid-friendly sway
        e.x += Math.sin(e.time * 2 + e.swayOffset) * 0.8;

        ctx.save();
        ctx.translate(e.x, e.y);

        if (e.type === 'balloon') {
          // --- Hot Air Balloon / Party Balloon ---
          ctx.fillStyle = e.color;
          ctx.beginPath();
          ctx.ellipse(0, -2, e.radius, e.radius * 1.2, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2.5;
          ctx.stroke();

          // Knot
          ctx.fillStyle = e.color;
          ctx.beginPath();
          ctx.moveTo(-4, e.radius * 1.15);
          ctx.lineTo(4, e.radius * 1.15);
          ctx.lineTo(0, e.radius * 1.35);
          ctx.closePath();
          ctx.fill();

          // Cute Smiling Face
          ctx.fillStyle = '#2d3436';
          ctx.beginPath();
          ctx.arc(-5, -2, 2.2, 0, Math.PI * 2);
          ctx.arc(5, -2, 2.2, 0, Math.PI * 2);
          ctx.fill();
          // Smile
          ctx.beginPath();
          ctx.arc(0, 3, 5, 0.1 * Math.PI, 0.9 * Math.PI);
          ctx.strokeStyle = '#2d3436';
          ctx.lineWidth = 2;
          ctx.stroke();

        } else if (e.type === 'cloud') {
          // --- Puffy Cute Cloud ---
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(-10, 0, 14, 0, Math.PI * 2);
          ctx.arc(10, 0, 14, 0, Math.PI * 2);
          ctx.arc(0, -8, 16, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#dff9fb';
          ctx.lineWidth = 3;
          ctx.stroke();

          // Happy closed eye arcs ^^
          ctx.strokeStyle = '#30336b';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(-7, 0, 3, Math.PI, 0);
          ctx.arc(7, 0, 3, Math.PI, 0);
          ctx.stroke();

          // Pink rosy cheeks
          ctx.fillStyle = 'rgba(255, 120, 150, 0.7)';
          ctx.beginPath();
          ctx.arc(-11, 4, 3, 0, Math.PI * 2);
          ctx.arc(11, 4, 3, 0, Math.PI * 2);
          ctx.fill();

        } else if (e.type === 'origami') {
          // --- Origami Paper Airplane ---
          ctx.rotate(Math.PI);
          ctx.fillStyle = '#ffeaa7';
          ctx.beginPath();
          ctx.moveTo(0, -18);
          ctx.lineTo(14, 16);
          ctx.lineTo(0, 10);
          ctx.lineTo(-14, 16);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = '#fdcb6e';
          ctx.lineWidth = 2;
          ctx.stroke();

          // Center crease
          ctx.beginPath();
          ctx.moveTo(0, -18);
          ctx.lineTo(0, 10);
          ctx.stroke();

        } else if (e.type === 'blimp') {
          // --- Friendly Jumbo Airship ---
          ctx.fillStyle = '#ff7675';
          ctx.beginPath();
          ctx.ellipse(0, 0, 30, 20, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 3;
          ctx.stroke();

          // Windows
          ctx.fillStyle = '#ffeaa7';
          for (let w = -15; w <= 15; w += 10) {
            ctx.beginPath();
            ctx.arc(w, 2, 3.5, 0, Math.PI * 2);
            ctx.fill();
          }

          // Mini HP Bar for Blimp
          ctx.fillStyle = 'rgba(0,0,0,0.3)';
          ctx.fillRect(-20, -26, 40, 5);
          ctx.fillStyle = '#2ecc71';
          ctx.fillRect(-20, -26, 40 * (e.hp / e.maxHp), 5);
        }

        ctx.restore();

        // Remove offscreen
        if (e.y - e.radius > ch + 30) {
          enemies.splice(i, 1);
        }
      }
    }

    function shootBullet() {
      sound.playShoot();
      // Double bubble shot from wings!
      bullets.push({
        x: player.x - 14,
        y: player.y - 20,
        vx: -15,
        vy: -480,
        radius: 6,
        color: '#fffa65'
      });
      bullets.push({
        x: player.x + 14,
        y: player.y - 20,
        vx: 15,
        vy: -480,
        radius: 6,
        color: '#fffa65'
      });
    }

    function drawBullets(dt) {
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx * dt;
        b.y += b.vy * dt;

        // Glowing Star Bubble
        ctx.save();
        ctx.fillStyle = b.color;
        ctx.shadowColor = '#fff200';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();

        if (b.y < -20) {
          bullets.splice(i, 1);
        }
      }
    }

    function spawnItem(x, y) {
      const types = ['star', 'candy', 'heart'];
      const pick = Math.random() < 0.7 ? 'star' : (Math.random() < 0.6 ? 'candy' : 'heart');
      items.push({
        x: x,
        y: y,
        type: pick,
        vy: 70,
        angle: 0,
        radius: 14
      });
    }

    function drawItems(dt) {
      for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        item.y += item.vy * dt;
        item.angle += dt * 3;

        // Gentle magnet effect toward player when close!
        const dx = player.x - item.x;
        const dy = player.y - item.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 120) {
          item.x += (dx / dist) * 140 * dt;
          item.y += (dy / dist) * 140 * dt;
        }

        ctx.save();
        ctx.translate(item.x, item.y);
        ctx.rotate(Math.sin(item.angle) * 0.2);

        if (item.type === 'star') {
          // Yellow 5-point star
          ctx.fillStyle = '#ffda79';
          ctx.strokeStyle = '#cc8e35';
          ctx.lineWidth = 2;
          drawStarPath(ctx, 0, 0, 5, 14, 7);
          ctx.fill();
          ctx.stroke();
        } else if (item.type === 'candy') {
          // Colorful spiral candy
          ctx.fillStyle = '#ff7675';
          ctx.beginPath();
          ctx.arc(0, 0, 11, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 3;
          ctx.stroke();
        } else if (item.type === 'heart') {
          // Little pink heart
          ctx.fillStyle = '#ff3838';
          drawHeartPath(ctx, 0, 0, 12);
          ctx.fill();
        }

        ctx.restore();

        // Collect item detection
        if (dist < player.width * 0.5 + item.radius) {
          sound.playCollect();
          if (item.type === 'star') {
            addScore(100);
            createFloatingText(item.x, item.y, '+100⭐', '#f39c12');
          } else if (item.type === 'candy') {
            addScore(200);
            createFloatingText(item.x, item.y, '달콤 냠냠!🍭', '#e84393');
          } else if (item.type === 'heart') {
            if (lives < maxLives) lives++;
            renderHearts();
            createFloatingText(item.x, item.y, '하트 뿅!💖', '#ff4757');
          }
          createConfetti(item.x, item.y, 10);
          items.splice(i, 1);
          continue;
        }

        if (item.y > ch + 30) {
          items.splice(i, 1);
        }
      }
    }

    function drawStarPath(ctx, cx, cy, spikes, outerRadius, innerRadius) {
      let rot = Math.PI / 2 * 3;
      let x = cx;
      let y = cy;
      let step = Math.PI / spikes;

      ctx.beginPath();
      ctx.moveTo(cx, cy - outerRadius);
      for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outerRadius;
        y = cy + Math.sin(rot) * outerRadius;
        ctx.lineTo(x, y);
        rot += step;

        x = cx + Math.cos(rot) * innerRadius;
        y = cy + Math.sin(rot) * innerRadius;
        ctx.lineTo(x, y);
        rot += step;
      }
      ctx.lineTo(cx, cy - outerRadius);
      ctx.closePath();
    }

    function drawHeartPath(ctx, cx, cy, size) {
      ctx.beginPath();
      const topCurveHeight = size * 0.3;
      ctx.moveTo(cx, cy + size * 0.3);
      ctx.bezierCurveTo(cx, cy, cx - size, cy, cx - size, cy - topCurveHeight);
      ctx.bezierCurveTo(cx - size, cy - size * 0.9, cx, cy - size * 0.8, cx, cy - size * 0.4);
      ctx.bezierCurveTo(cx, cy - size * 0.8, cx + size, cy - size * 0.9, cx + size, cy - topCurveHeight);
      ctx.bezierCurveTo(cx + size, cy, cx, cy, cx, cy + size * 0.3);
      ctx.closePath();
    }

    function createConfetti(x, y, count = 12) {
      const colors = ['#ff7675', '#74b9ff', '#55efc4', '#ffeaa7', '#a29bfe', '#fd79a8'];
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 60 + Math.random() * 120;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: 3 + Math.random() * 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 0.7 + Math.random() * 0.4,
          maxLife: 1.0
        });
      }
    }

    function createRainbowParticle(x, y) {
      const colors = ['#ff7675', '#fdcb6e', '#ffeaa7', '#55efc4', '#74b9ff', '#a29bfe'];
      particles.push({
        x: x + (Math.random() - 0.5) * 16,
        y: y + 20,
        vx: (Math.random() - 0.5) * 20,
        vy: 30 + Math.random() * 30,
        radius: 4 + Math.random() * 3,
        color: colors[Math.floor(Math.random() * colors.length)],
        life: 0.6,
        maxLife: 0.6
      });
    }

    function createFloatingText(x, y, text, color) {
      floatingTexts.push({
        x: x,
        y: y,
        text: text,
        color: color,
        life: 1.0,
        vy: -40
      });
    }

    function drawParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;

        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        if (p.life <= 0) particles.splice(i, 1);
      }

      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y += ft.vy * dt;
        ft.life -= dt;

        ctx.save();
        ctx.globalAlpha = Math.max(0, ft.life);
        ctx.font = 'bold 18px "Jua", sans-serif';
        ctx.fillStyle = ft.color;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.strokeText(ft.text, ft.x - 20, ft.y);
        ctx.fillText(ft.text, ft.x - 20, ft.y);
        ctx.restore();

        if (ft.life <= 0) floatingTexts.splice(i, 1);
      }
    }

    function checkCollisions() {
      // 1. Bullets vs Enemies
      for (let bi = bullets.length - 1; bi >= 0; bi--) {
        const b = bullets[bi];
        for (let ei = enemies.length - 1; ei >= 0; ei--) {
          const e = enemies[ei];
          const dist = Math.hypot(b.x - e.x, b.y - e.y);
          if (dist < b.radius + e.radius) {
            e.hp--;
            bullets.splice(bi, 1);
            createConfetti(b.x, b.y, 4);

            if (e.hp <= 0) {
              sound.playPop();
              createConfetti(e.x, e.y, 16);
              spawnItem(e.x, e.y);
              addScore(e.type === 'blimp' ? 500 : 50);

              // Kid cheer popup
              const cheerWords = ['대단해!✨', '팡팡!🎈', '최고야!👍', '우와~!⭐'];
              createFloatingText(e.x, e.y, cheerWords[Math.floor(Math.random() * cheerWords.length)], '#e67e22');
              enemies.splice(ei, 1);
            }
            break;
          }
        }
      }

      // 2. Player vs Enemies
      for (let ei = enemies.length - 1; ei >= 0; ei--) {
        const e = enemies[ei];
        const dist = Math.hypot(player.x - e.x, player.y - e.y);
        
        // If looping: Player is invulnerable and rams enemies with rainbow power!
        if (player.isLooping && dist < 50 + e.radius) {
          sound.playPop();
          createConfetti(e.x, e.y, 18);
          spawnItem(e.x, e.y);
          addScore(100);
          createFloatingText(e.x, e.y, '빙글 박치기!🌀', '#9b59b6');
          enemies.splice(ei, 1);
          continue;
        }

        // Normal touch
        if (dist < player.width * 0.4 + e.radius) {
          if (player.invulnerableTimer <= 0) {
            if (!godMode) {
              lives--;
              renderHearts();
              player.invulnerableTimer = 2.0; // 2 seconds safety
              sound.playPop();
              createFloatingText(player.x, player.y - 20, '쿵! 괜찮아!', '#e74c3c');
              if (lives <= 0) {
                // In kid game, reset back with cheer instead of game over!
                lives = 3;
                renderHearts();
              }
            } else {
              // God mode feedback: Boing bounce off safely!
              player.invulnerableTimer = 0.8;
              createConfetti(e.x, e.y, 8);
              createFloatingText(player.x, player.y - 20, '통통 튕겨요!🛡️', '#2ecc71');
              e.y += 30; // Push enemy away
            }
          }
        }
      }
    }

    function addScore(pts) {
      score += pts;
      document.getElementById('scoreDisplay').innerText = score;

      // Celebrate high milestones!
      if (score >= 3000 && gameState === 'PLAYING') {
        triggerVictory();
      }
    }

    function renderHearts() {
      const container = document.getElementById('heartContainer');
      container.innerHTML = '';
      if (godMode) {
        container.innerHTML = `<span class="text-2xl" title="하트 무제한">💖</span><span class="text-xs font-black text-rose-600 bg-rose-100 px-2 py-0.5 rounded-full">안전 날개</span>`;
        return;
      }
      for (let i = 0; i < maxLives; i++) {
        const heart = document.createElement('span');
        heart.className = 'text-xl transition-all duration-300';
        heart.innerText = i < lives ? '❤️' : '🤍';
        container.appendChild(heart);
      }
    }

    function triggerLoopManeuver() {
      if (player.isLooping || loopBombs <= 0) return;
      loopBombs--;
      document.getElementById('loopCountText').innerText = loopBombs;
      player.isLooping = true;
      player.loopProgress = 0;
      sound.playLoop();
      createFloatingText(player.x, player.y - 30, '빙그르르 슛!🌀', '#fd79a8');
    }

    function triggerVictory() {
      gameState = 'CLEAR';
      sound.playCheer();
      document.getElementById('finalScoreText').innerText = score + '점';
      document.getElementById('victoryOverlay').classList.remove('hidden');
    }

    // Smooth Follow Mouse/Touch
    let pointerDown = false;

    function handlePointerMove(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.clientX || (e.touches && e.touches[0].clientX);
      const clientY = e.clientY || (e.touches && e.touches[0].clientY);
      if (clientX !== undefined && clientY !== undefined) {
        player.targetX = clientX - rect.left;
        player.targetY = clientY - rect.top;
      }
    }

    canvas.addEventListener('pointerdown', (e) => {
      pointerDown = true;
      handlePointerMove(e);
    });

    window.addEventListener('pointermove', (e) => {
      if (pointerDown || gameState === 'PLAYING') {
        handlePointerMove(e);
      }
    });

    window.addEventListener('pointerup', () => { pointerDown = false; });
    window.addEventListener('pointercancel', () => { pointerDown = false; });

    // Keyboard support for desktop arrows/WASD & Space for Loop
    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.key] = true;
      if (e.code === 'Space') {
        triggerLoopManeuver();
      }
    });
    window.addEventListener('keyup', (e) => {
      keys[e.key] = false;
    });

    function gameLoop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
      lastTime = timestamp;

      if (gameState === 'PLAYING') {
        // Keyboard movement delta
        let kx = 0;
        let ky = 0;
        if (keys['ArrowLeft'] || keys['KeyA']) kx -= 300 * dt;
        if (keys['ArrowRight'] || keys['KeyD']) kx += 300 * dt;
        if (keys['ArrowUp'] || keys['KeyW']) ky -= 300 * dt;
        if (keys['ArrowDown'] || keys['KeyS']) ky += 300 * dt;

        if (kx !== 0 || ky !== 0) {
          player.targetX = Math.max(25, Math.min(cw - 25, player.targetX + kx));
          player.targetY = Math.max(40, Math.min(ch - 40, player.targetY + ky));
        }

        // Smooth plane interpolation
        const prevX = player.x;
        player.x += (player.targetX - player.x) * 0.18;
        player.y += (player.targetY - player.y) * 0.18;
        player.tilt = (player.x - prevX); // Natural banking tilt

        // Constrain player bounds
        player.x = Math.max(24, Math.min(cw - 24, player.x));
        player.y = Math.max(30, Math.min(ch - 50, player.y));

        // Auto firing for toddlers (stress-free!)
        shootTimer += dt;
        if (shootTimer >= 0.22 && !player.isLooping) {
          shootTimer = 0;
          shootBullet();
        }

        // Spawn gentle enemies
        spawnTimer += dt;
        if (spawnTimer >= 1.25) {
          spawnTimer = 0;
          spawnEnemy();
        }

        // Collision detection
        checkCollisions();
      }

      // Drawing Phase
      ctx.clearRect(0, 0, cw, ch);
      drawBackground(dt);
      drawEnemies(dt);
      drawBullets(dt);
      drawItems(dt);
      drawPlayer(dt);
      drawParticles(dt);

      requestAnimationFrame(gameLoop);
    }

    function resetGame() {
      score = 0;
      lives = maxLives;
      loopBombs = 3;
      bullets = [];
      enemies = [];
      items = [];
      particles = [];
      floatingTexts = [];
      document.getElementById('scoreDisplay').innerText = '0';
      document.getElementById('loopCountText').innerText = loopBombs;
      renderHearts();
      player.x = cw / 2;
      player.y = ch * 0.8;
      player.targetX = player.x;
      player.targetY = player.y;
      player.isLooping = false;
      player.invulnerableTimer = 0;
    }

    // UI Buttons
    document.getElementById('startGameBtn').addEventListener('click', () => {
      sound.init();
      sound.startBGM();
      document.getElementById('startOverlay').classList.add('hidden');
      resetGame();
      gameState = 'PLAYING';
    });

    document.getElementById('pauseBtn').addEventListener('click', () => {
      if (gameState === 'PLAYING') {
        gameState = 'PAUSED';
        document.getElementById('pauseOverlay').classList.remove('hidden');
      }
    });

    document.getElementById('resumeBtn').addEventListener('click', () => {
      gameState = 'PLAYING';
      document.getElementById('pauseOverlay').classList.add('hidden');
    });

    document.getElementById('restartBtn').addEventListener('click', () => {
      document.getElementById('pauseOverlay').classList.add('hidden');
      resetGame();
      gameState = 'PLAYING';
    });

    document.getElementById('playAgainBtn').addEventListener('click', () => {
      document.getElementById('victoryOverlay').classList.add('hidden');
      resetGame();
      gameState = 'PLAYING';
    });

    document.getElementById('loopBtn').addEventListener('click', () => {
      triggerLoopManeuver();
    });

    // God mode toggle button
    document.getElementById('godModeBtn').addEventListener('click', () => {
      godMode = !godMode;
      document.getElementById('godModeText').innerText = godMode ? '무적 모드: ON' : '도전 모드: 5하트';
      renderHearts();
      createFloatingText(cw / 2, ch / 2, godMode ? '무적 ON!🛡️' : '하트 모드!❤️', '#27ae60');
    });

    // BGM toggle
    document.getElementById('bgmToggleBtn').addEventListener('click', () => {
      sound.init();
      const muted = sound.toggleMute();
      document.getElementById('bgmToggleBtn').innerHTML = muted
        ? '<i class="fa-solid fa-volume-xmark"></i>'
        : '<i class="fa-solid fa-music"></i>';
    });

    // Airplane Color selection
    const colorButtons = document.querySelectorAll('.color-choice');
    colorButtons.forEach(btn => {
      btn.addEventListener('click', (e) => {
        colorButtons.forEach(b => b.classList.remove('ring-4', 'ring-amber-400'));
        btn.classList.add('ring-4', 'ring-amber-400');
        playerColor = btn.dataset.color;
        sound.init();
        sound.playPop();
      });
    });

    window.onload = function () {
      resizeCanvas();
      initBackground();
      renderHearts();
      // Initialize player coordinates
      player.x = cw / 2;
      player.y = ch * 0.8;
      player.targetX = player.x;
      player.targetY = player.y;

      // Start rendering loop
      requestAnimationFrame(gameLoop);
    };
  </script>
</body>
</html>
